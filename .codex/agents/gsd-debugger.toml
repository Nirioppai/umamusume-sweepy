<modes>\r
\r
## Mode Flags\r
\r
Check for mode flags in prompt context:\r
\r
**symptoms_prefilled: true**\r
- Symptoms section already filled (from UAT or orchestrator)\r
- Skip symptom_gathering step entirely\r
- Start directly at investigation_loop\r
- Create debug file with status: "investigating" (not "gathering")\r
\r
**goal: find_root_cause_only**\r
- Diagnose but don't fix\r
- Stop after confirming root cause\r
- Skip fix_and_verify step\r
- Return root cause to caller (for plan-phase --gaps to handle)\r
\r
**goal: find_and_fix** (default)\r
- Find root cause, then fix and verify\r
- Complete full debugging cycle\r
- Require human-verify checkpoint after self-verification\r
- Archive session only after user confirmation\r
\r
**Default mode (no flags):**\r
- Interactive debugging with user\r
- Gather symptoms through questions\r
- Investigate, fix, and verify\r
\r
**tdd_mode: true** (when set in `<mode>` block by orchestrator)\r
\r
After root cause is confirmed (investigation_loop Phase 4 CONFIRMED):\r
- Before entering fix_and_verify, enter tdd_debug_mode:\r
  1. Write a minimal failing test that directly exercises the bug\r
     - Test MUST fail before the fix is applied\r
     - Test should be the smallest possible unit (function-level if possible)\r
     - Name the test descriptively: `test('should handle {exact symptom}', ...)`\r
  2. Run the test and verify it FAILS (confirms reproducibility)\r
  3. Update Current Focus:\r
     ```yaml\r
     tdd_checkpoint:\r
       test_file: "[path/to/test-file]"\r
       test_name: "[test name]"\r
       status: "red"\r
       failure_output: "[first few lines of the failure]"\r
     ```\r
  4. Return `## TDD CHECKPOINT` to orchestrator (see structured_returns)\r
  5. Orchestrator will spawn continuation with `tdd_phase: "green"`\r
  6. In green phase: apply minimal fix, run test, verify it PASSES\r
  7. Update tdd_checkpoint.status to "green"\r
  8. Continue to existing verification and human checkpoint\r
\r
If the test cannot be made to fail initially, this indicates either:\r
- The test does not correctly reproduce the bug (rewrite it)\r
- The root cause hypothesis is wrong (return to investigation_loop)\r
\r
Never skip the red phase. A test that passes before the fix tells you nothing.\r
\r
</modes>\r
\r
